language: en-US
tone_instructions: 'Keep reviews concise. No filler praise or emoji. Focus on real issues only; if no issues, say so briefly.'

reviews:
  profile: chill
  path_filters:
    - 'mailpoet/lib/**/*.php'
    - 'mailpoet/tests/**/*.php'
    - 'mailpoet/views/**/*.html'
    - 'mailpoet/assets/js/src/**/*.js'
    - 'mailpoet/assets/js/src/**/*.jsx'
    - 'mailpoet/assets/js/src/**/*.ts'
    - 'mailpoet/assets/js/src/**/*.tsx'
    - 'mailpoet/assets/**/*.{css,scss}'
  path_instructions:
    - path: 'mailpoet/**/*.{php,html,js,jsx,ts,tsx}'
      instructions: |
        - Consider full file context before commenting; do not rely only on the diff.
        - Use line numbers from the actual file, not from the diff.
        - Only report issues you are certain about; if unsure, say so explicitly.
        - Do not flag standard WordPress/WooCommerce patterns (e.g. $wpdb->posts interpolation, get_posts() with posts_per_page => -1 for bounded queries).
        - Focus on real bugs, logic errors, security vulnerabilities, and missing edge cases — not stylistic preferences.
        - Categorize each finding as: Bug, Security, Performance, or Suggestion.
        - For each finding: give file path, line number, brief explanation of why it is a problem, and a concrete fix.
        - If there are no real issues, say "No issues found"; do not invent problems to fill the review.
    - path: 'mailpoet/**/*.{js,jsx,ts,tsx,css,scss}'
      instructions: |
        For UI changes, check that the code follows the WordPress Design System (WPDS). Only flag concrete deviations
        and skip this check for changes that don't touch the WordPress admin UI. Email content and public form styles
        are out of scope.
        Components:
        - Don't hand-roll a component that `@wordpress/ui` or `@wordpress/components` already provides (Card, Badge,
          Notice, Tooltip, Popover, Modal, Tabs, VisuallyHidden, etc.).
        - Prefer `@wordpress/ui` and `@wordpress/components` over `@woocommerce/components` when the component is
          already available in those packages.
        - Prefer `@wordpress/ui` primitives over custom CSS or raw elements: `Stack` instead of `display: flex` and
          gap/margin layouts, `Text` instead of `p` or headings with custom font styles, `Link` instead of `a`.
        Styling:
        - Use `--wpds-*` tokens instead of fixed hex colors, pixel font sizes, radii, or motion values. Pick the token
          closest in semantic role (not just the nearest hex value) and make sure it exists in the installed
          `@wordpress/theme`.
        - Don't add legacy Sass color variables or `--wp-admin-*` tokens. Use the `--wpds-*` equivalent. Legacy
          variables include the `@automattic/color-studio` and `@wordpress/base-styles` palettes (`$gray-700`,
          `$studio-*`, `$alert-red`, `$white`) and the shared colors in
          `mailpoet/assets/css/src/settings/_colors.scss` (`$color-primary`, `$color-white`, `$color-wordpress-*`,
          `$color-destructive`) and `mailpoet/assets/css/src/components-automation/_colors.scss`
          (`$color-gutenberg-*`, `$color-wp-*`).
        - Don't heavily override component styles, or restyle a component with CSS to get a variant. Use a
          component's props instead when one exists (e.g. a font size prop on `Text` rather than CSS). Position,
          width, and margin additions are fine because they don't change the component's appearance. If an override
          only preserves old visuals, or stacks on another override, ask whether it is needed or whether the shared
          component should change.
        - Don't target internal `.components-*` (e.g. `.components-button`,
          `.components-popover__content`) or other `@wordpress/components` class names. They aren't stable.
        - If a WPDS component seems to misbehave, suspect a CSS reset or specificity conflict before accepting a local
          workaround.
        - If a workaround is needed because a WPDS component lacks a capability, it is acceptable as a temporary
          measure. Ask for a code comment linking the upstream issue (e.g. in WordPress/gutenberg) so it reads as a
          deliberate workaround that can be removed once the issue is fixed.
        Copy:
        - Button and label text uses sentence case ("Edit form", not "Edit Form").
  poem: false
  in_progress_fortune: false
  # The summary is written into the pull request description, replacing what the
  # author put there, so it is off rather than moved elsewhere.
  high_level_summary: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'AGENTS.md'
